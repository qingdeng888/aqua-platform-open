<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUA Gateway v10.0 管理控制台</title>
<style>
/* ===== 设计令牌（与 platform 管理后台同代际的深色体系） ===== */
:root{
  --bg-0:#0e0f1c; --bg-1:#1a1a2e; --bg-2:#20203a; --bg-3:#262647;
  --border:#2e2e52; --border-2:#3d3d6e;
  --primary:#00d4ff; --primary-2:#448aff; --on-primary:#081020;
  --text:#e8eaf6; --text-2:#a0a4c8; --text-3:#6d7195;
  --success:#3ddc84; --warning:#ffb224; --danger:#ff5c5c; --danger-2:#c62828;
  --info:#5ac8fa;
  --radius:12px; --radius-sm:8px;
  --grad:linear-gradient(135deg,#00d4ff,#448aff);
  --shadow:0 8px 32px rgba(0,0,0,.35);
  --mono:'SF Mono','Cascadia Code',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg-0);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--primary);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
code{font-family:var(--mono);font-size:11px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ===== 布局 ===== */
.app{display:flex;height:100%;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)}
.brand-logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:var(--on-primary);font-weight:800;font-size:16px;flex:none}
.brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
.brand-name small{display:block;font-size:11px;font-weight:400;color:var(--text-3)}
.side-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-2);transition:all .15s;font-size:13px;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{background:var(--bg-2);color:var(--text)}
.nav-item.active{background:rgba(0,212,255,.1);color:var(--primary);border-color:rgba(0,212,255,.25)}
.nav-sub{padding-left:30px!important;font-size:12px!important}
.nav-sub::before{content:'└';color:var(--text-3);margin-right:2px}
.side-foot{padding:12px;border-top:1px solid var(--border)}
.side-foot .btn{width:100%}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-header{padding:14px 24px;background:var(--bg-1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.crumb{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--text-3);font-weight:400;margin:0 6px}
.crumb .cur{color:var(--primary)}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.content{flex:1;padding:20px 24px;overflow-y:auto}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
.mobile-tabs{display:none;background:var(--bg-1);border-top:1px solid var(--border);overflow-x:auto}
.mobile-tabs .tab-item{flex:1;min-width:64px;text-align:center;padding:9px 4px;font-size:11px;cursor:pointer;color:var(--text-2);transition:all .15s;white-space:nowrap}
.mobile-tabs .tab-item.active{color:var(--primary)}
.overlay{display:none;position:fixed;inset:0;background:rgba(5,6,15,.5);z-index:99}
.overlay.show{display:block}

/* ===== 卡片 / 统计 ===== */
.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px}
.card + .card{margin-top:12px}
.card-title{font-size:14px;font-weight:600;margin-bottom:10px;color:#fff}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px}
.stat-card .stat-label{font-size:12px;color:var(--text-2);margin-bottom:4px}
.stat-card .stat-value{font-size:21px;font-weight:700;color:var(--text);word-break:break-all}
.stat-card .stat-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.stat-card.clickable{cursor:pointer;transition:all .15s}
.stat-card.clickable:hover{border-color:var(--primary);background:var(--bg-2)}

/* ===== 徽章 ===== */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-green{background:rgba(61,220,132,.13);color:var(--success)}
.badge-red{background:rgba(255,92,92,.13);color:var(--danger)}
.badge-yellow{background:rgba(255,178,36,.13);color:var(--warning)}
.badge-blue{background:rgba(90,200,250,.13);color:var(--info)}
.badge-cyan{background:rgba(0,212,255,.12);color:var(--primary)}
.badge-gray{background:rgba(160,164,200,.13);color:var(--text-2)}
.badge-row{display:flex;flex-wrap:wrap;gap:6px}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-2);color:var(--text);cursor:pointer;font-size:13px;transition:all .15s}
.btn:hover{border-color:var(--border-2);background:var(--bg-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--grad);border:none;color:var(--on-primary);font-weight:600}
.btn-primary:hover{filter:brightness(1.12)}
.btn-danger{background:var(--danger-2);border-color:var(--danger-2);color:#fff}
.btn-danger:hover{background:#a01f1f;border-color:#a01f1f}
.btn-warning{background:rgba(255,178,36,.15);border-color:rgba(255,178,36,.5);color:var(--warning)}
.btn-success{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.5);color:var(--success)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{color:var(--text);background:var(--bg-2);border-color:transparent}

/* ===== 表格 ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid rgba(46,46,82,.6);white-space:nowrap}
th{color:var(--text-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg-2)}
td{vertical-align:middle}
td.wrap-cell{white-space:normal;word-break:break-all}
tr:hover td{background:rgba(255,255,255,.02)}
.cell-actions{display:flex;gap:6px}

/* ===== 表单 ===== */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-0);color:var(--text);outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-hint{font-size:12px;color:var(--text-3);line-height:1.6}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-bar input,.filter-bar select{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-1);color:var(--text);font-size:12px;outline:none}
.filter-bar input:focus{border-color:var(--primary)}

/* ===== 开关组件 ===== */
.switch{position:relative;display:inline-block;width:42px;height:23px;flex:none;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--bg-3);border:1px solid var(--border-2);border-radius:12px;transition:.2s;cursor:pointer}
.switch .track::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:var(--text-3);border-radius:50%;transition:.2s}
.switch input:checked + .track{background:rgba(0,212,255,.22);border-color:var(--primary)}
.switch input:checked + .track::before{transform:translateX(19px);background:var(--primary)}

/* ===== scopes 多选 ===== */
.scopes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.scope-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text);background:var(--bg-0)}
.scope-item:hover{border-color:var(--border-2)}
.scope-item input{width:auto;accent-color:var(--primary)}
.scope-item .desc{display:block;font-size:10px;color:var(--text-3)}

/* ===== Toast ===== */
.toast-container{position:fixed;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 18px;border-radius:var(--radius-sm);background:var(--bg-1);border:1px solid var(--border);color:var(--text);font-size:13px;box-shadow:var(--shadow);animation:toastIn .25s ease;max-width:380px}
.toast-success{border-left:3px solid var(--success)}
.toast-error{border-left:3px solid var(--danger)}
.toast-info{border-left:3px solid var(--primary)}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}

/* ===== 弹窗 ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,6,15,.65);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--radius);min-width:380px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:15px;font-weight:600;color:#fff}
.modal-close{background:none;border:none;color:var(--text-3);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:18px 20px}
.modal-body p{font-size:13px;color:var(--text-2);line-height:1.6}
.modal-body p.warn{color:var(--warning)}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.secret-input{width:100%;padding:9px 12px;background:var(--bg-0);border:1px solid var(--border-2);border-radius:var(--radius-sm);color:var(--primary);font-family:var(--mono);font-size:12px;outline:none}

/* ===== 加载/空态 ===== */
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.state-block{text-align:center;padding:44px 20px}
.state-block .ico{font-size:24px;display:block;margin-bottom:8px;opacity:.7}
.state-block .msg{color:var(--text-3);font-size:13px;margin-bottom:12px}
.state-block.card{border:none}

/* ===== 分页 ===== */
.pagination{display:flex;align-items:center;gap:8px;justify-content:center;padding:14px 0}
.pagination .page-info{font-size:12px;color:var(--text-2)}

/* ===== 图表条 ===== */
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:18px 0 6px}
.chart-bar{flex:1;background:linear-gradient(to top,var(--primary),rgba(0,212,255,.25));border-radius:3px 3px 0 0;min-height:4px;transition:height .3s;position:relative}
.chart-bar:hover{opacity:.85}
.chart-bar-label{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-3);white-space:nowrap}
.chart-bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-2);white-space:nowrap}
.chart-hour{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.chart-hour .bar{width:100%;background:linear-gradient(to top,var(--primary),rgba(0,212,255,.15));border-radius:2px 2px 0 0;min-height:4px}
.chart-hour .hl{font-size:8px;color:var(--text-3);text-align:center;white-space:nowrap}

/* ===== 区块 ===== */
.section-title{font-size:14px;font-weight:600;margin-bottom:12px;margin-top:20px;color:#fff}
.section-title:first-child{margin-top:0}
.section-title .cnt{font-weight:400;color:var(--text-3);font-size:12px;margin-left:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv-table td:first-child{color:var(--text-2);white-space:nowrap;width:1%;padding:5px 10px;font-size:12px}
.kv-table td:last-child{padding:5px 10px;font-size:12px;word-break:break-all;white-space:normal}
pre.code-block{background:var(--bg-0);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:11px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-family:var(--mono)}
pre.code-block.err{color:var(--danger)}

/* ===== 工具类 ===== */
.flex{display:flex}
.flex-wrap{flex-wrap:wrap}
.gap-8{gap:8px}
.gap-12{gap:12px}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.mb-8{margin-bottom:8px}
.mb-12{margin-bottom:12px}
.mt-8{margin-top:8px}
.mt-12{margin-top:12px}
.text-sec{color:var(--text-2)}
.text-dim{color:var(--text-3)}
.text-sm{font-size:12px}
.text-xs{font-size:11px}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.text-warning{color:var(--warning)}
.mono{font-family:var(--mono);font-size:12px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;display:inline-block;vertical-align:middle}

/* ===== 登录 ===== */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;padding:20px}
.login-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);padding:34px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.login-card h2{text-align:center;margin-bottom:22px;color:var(--primary);font-size:19px}
.login-card .btn{width:100%;justify-content:center;padding:10px}

/* ===== 响应式 ===== */
@media (max-width:1024px){
  .sidebar{position:fixed;left:-220px;top:0;bottom:0;z-index:100;transition:left .25s}
  .sidebar.open{left:0}
  .hamburger{display:block}
  .content{padding:16px}
  .main-header{padding:12px 16px}
}
@media (max-width:768px){
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50}
  .main{padding-bottom:48px}
  .sidebar{display:none}
  .sidebar.open{display:flex;left:0;width:220px}
  .content{padding:12px}
  .main-header{padding:10px 12px}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .modal{min-width:auto;width:92vw}
  .grid-2{grid-template-columns:1fr}
  .hamburger{display:block}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">G</div>
      <div class="brand-name">AQUA Gateway<small>网关管理控制台</small></div>
    </div>
    <nav class="side-nav" id="sidebarNav"></nav>
    <div class="side-foot">
      <button class="btn btn-ghost btn-sm" data-act="logout">退出登录</button>
    </div>
  </aside>
  <div class="main">
    <header class="main-header">
      <div class="flex items-center gap-8" style="min-width:0">
        <button class="hamburger" id="hamburgerBtn">&#9776;</button>
        <div class="crumb" id="crumb"></div>
      </div>
      <div class="header-actions" id="headerActions"></div>
    </header>
    <main class="content" id="content"></main>
  </div>
  <nav class="mobile-tabs" id="mobileTabs"></nav>
</div>
<div class="overlay" id="overlay"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<div class="toast-container" id="toastContainer"></div>

<script src="/static/js/console/core.js"></script>
<script src="/static/js/console/pages-data.js"></script>
<script src="/static/js/console/pages-ops.js"></script>
</body>
</html>
