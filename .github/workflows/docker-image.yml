# ============================================================================
# 构建并推送 Docker 镜像到 GHCR（GitHub Container Registry）
# ----------------------------------------------------------------------------
# 触发：推送任意分支 / 推送 v* 标签 / 向 main 提 PR / 手动运行
# 顺序：先跑两套测试，全绿才构建镜像——测试红灯不发镜像
# 凭据：GHCR 用内置 GITHUB_TOKEN 登录，无需配置任何 Secret
#
# 镜像地址：ghcr.io/<owner>/<repo>（由 github.repository 自动推导，fork 后无需改）
# 镜像标签：分支名 / 语义版本(打 tag 时) / sha-<短哈希> / latest(默认分支推送与打 tag 时)
# 镜像架构：会更新 latest 的构建（默认分支 / v* 标签）恒为 linux/amd64 + linux/arm64 双架构；
#           其他分支与 PR 只构 amd64（QEMU 模拟 arm64 约慢 3 倍，日常推送不值当）
#
# ⚠️ 首次构建后 GHCR 包默认是 private，`docker pull` 会要求登录。
#    公开拉取需到 GitHub → Packages → 该包 → Package settings → Change
#    visibility → Public（只需做一次）。
# ============================================================================

name: docker-image

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    # 纯文档改动不必重跑流水线（.dockerignore 已把 md/docs 排除在镜像外）
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在跑的流水线，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 测试（后端单测 + 前端静态检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与 Dockerfile 的 python:3.13-slim 对齐，避免"CI 过了镜像跑不起来"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: gateway/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt pytest pytest-asyncio

      # 两套测试都不连库不连网，无需注入 PG_PASSWORD 等任何环境变量
      - name: 后端单元测试
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 前端静态检查
        run: node tests/static-smoke.mjs

  build:
    name: 构建并推送镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 会更新 latest 的构建必须是双架构：默认分支推送刷新 latest，打 v* 标签发语义版本 + latest。
      # 其余分支与 PR 只构 amd64——QEMU 模拟 arm64 慢（实测 3.5min vs 1min），日常推送不值当。
      - name: 计算目标架构
        id: plat
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" || "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "qemu=1" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "qemu=0" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$REF_NAME ($REF_TYPE) 默认分支=$DEFAULT_BRANCH" >> "$GITHUB_STEP_SUMMARY"

      - name: 准备 QEMU（交叉构建 arm64 用）
        if: steps.plat.outputs.qemu == '1'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # PR 只验证能否构建成功，不登录、不推送（fork 的 PR 也拿不到写权限）
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 标注
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 跨 workflow 复用层缓存：依赖未变时 builder 阶段直接命中
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 不生成 provenance 证明，避免 GHCR 包页面出现 unknown/unknown 条目
          provenance: false

      - name: 输出镜像地址
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORMS: ${{ steps.plat.outputs.platforms }}
        run: |
          {
            echo "### 镜像已推送（架构：$PLATFORMS）"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 守卫：凡是打了 latest 的推送，manifest 必须同时含 amd64 与 arm64。
      # 架构判定逻辑一旦被改坏，这里立刻红灯，而不是等用户在 arm 机器上 pull 才发现。
      - name: 校验 latest 为双架构
        if: github.event_name != 'pull_request' && contains(steps.meta.outputs.tags, ':latest')
        run: |
          img="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker buildx imagetools inspect "$img" > /tmp/manifest.txt
          cat /tmp/manifest.txt
          for p in linux/amd64 linux/arm64; do
            grep -q "$p" /tmp/manifest.txt || { echo "::error::$img 缺少 $p"; exit 1; }
          done
          echo "✅ $img 双架构校验通过（linux/amd64 + linux/arm64）" >> "$GITHUB_STEP_SUMMARY"
