<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>系统维护中 - AQUA</title>
<style>
body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;}
.container{text-align:center;padding:40px;max-width:500px;}
.logo{font-size:48px;font-weight:bold;color:#00d4ff;margin-bottom:20px;letter-spacing:4px;}
.title{font-size:24px;margin:20px 0;color:#fff;}
.msg{color:#a0a0b0;line-height:1.6;margin:10px 0;}
.spinner{display:inline-block;width:40px;height:40px;border:3px solid #2a3a5c;
         border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite;margin:20px 0;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">AQUA</div>
  <div class="title">系统维护中</div>
  <div class="spinner"></div>
  <p class="msg">我们正在进行系统升级，以提供更好的服务体验</p>
  <p class="msg">维护期间所有服务暂停访问，请稍后再试</p>
  <p class="msg" style="color:#6b7280;font-size:14px;margin-top:30px;">如有紧急问题请联系管理员</p>
</div>
</body>
</html>
