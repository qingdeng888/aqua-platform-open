<!DOCTYPE html>
<!-- 职责：SPA 外壳——布局骨架（导航/侧边栏/内容区/浮动按钮）+ 样式与模块入口；页面内容由 js/pages/* 渲染 -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AQUA AI平台</title>
  <meta name="description" content="AQUA AI平台 - 66+ 可用模型免费使用">
  <link rel="stylesheet" href="/static/css/base.css?v=11.0">
  <link rel="stylesheet" href="/static/css/components.css?v=11.0">
  <link rel="stylesheet" href="/static/css/pages.css?v=11.0">
</head>
<body>

  <!-- 顶部导航栏 -->
  <nav id="navbar" class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <a href="#/" class="brand-logo">
          <span id="brand-logo-icon"></span>
          <span class="brand-name">AQUA</span>
          <span class="brand-tag">AI平台</span>
        </a>
      </div>
      <div class="navbar-links" id="navbar-links">
        <a href="#/" data-route="/">首页</a>
        <a href="#/models" data-route="/models">模型</a>
        <a href="#/docs" data-route="/docs">API文档</a>
        <a href="#/sponsor" data-route="/sponsor" style="color:var(--accent-warning)">赞助</a>
      </div>
      <div class="navbar-actions">
        <button id="hamburger-btn" class="hamburger-btn" title="菜单" aria-label="打开菜单">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" title="切换主题" aria-label="切换主题"></button>
        <div id="auth-area"></div>
      </div>
    </div>
  </nav>

  <!-- 主布局 -->
  <div id="main-layout" class="main-layout">

    <!-- 侧边栏（仅控制台页面显示，由 layout.js 控制） -->
    <aside id="app-sidebar" class="app-sidebar" style="display:none">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar"></div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-username">用户</div>
          <div class="sidebar-user-email" id="sidebar-useremail">-</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#/console" data-route="/console" class="nav-item"><span class="nav-icon" id="ico-overview"></span><span>概览</span></a>
        <a href="#/console/keys" data-route="/console/keys" class="nav-item"><span class="nav-icon" id="ico-keys"></span><span>密钥管理</span></a>
        <a href="#/console/chat" data-route="/console/chat" class="nav-item"><span class="nav-icon" id="ico-chat"></span><span>AI对话</span></a>
        <a href="#/console/models" data-route="/console/models" class="nav-item"><span class="nav-icon" id="ico-models"></span><span>模型列表</span></a>
        <a href="#/console/stats" data-route="/console/stats" class="nav-item"><span class="nav-icon" id="ico-stats"></span><span>统计面板</span></a>
        <a href="#/console/logs" data-route="/console/logs" class="nav-item"><span class="nav-icon" id="ico-logs"></span><span>请求日志</span></a>
        <a href="#/console/feedback" data-route="/console/feedback" class="nav-item"><span class="nav-icon" id="ico-feedback"></span><span>问题反馈</span></a>
        <a href="#/console/model-status" data-route="/console/model-status" class="nav-item"><span class="nav-icon" id="ico-model-status"></span><span>模型状态</span></a>
        <a href="#/console/docs" data-route="/console/docs" class="nav-item"><span class="nav-icon" id="ico-docs"></span><span>API文档</span></a>
        <a href="#/console/settings" data-route="/console/settings" class="nav-item"><span class="nav-icon" id="ico-settings"></span><span>设置</span></a>
        <a href="#/sponsor" data-route="/sponsor" class="nav-item" style="color:var(--accent-warning)">
          <span class="nav-icon" style="font-size:16px">💝</span><span style="font-weight:600">赞助支持</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="#/sponsor" class="sidebar-sponsor-link">
          <span style="font-size:16px">💝</span>
          <span>赞助支持</span>
        </a>
        <a href="https://qm.qq.com/q/jGnpIQWY5c" target="_blank" rel="noopener noreferrer" class="sidebar-qq-link" id="sidebar-qq-link">
          <span class="nav-icon" id="ico-qq"></span>
          <span>QQ交流群(三群)</span>
        </a>
        <button class="nav-item" id="sidebar-logout" type="button">
          <span class="nav-icon" id="ico-logout"></span>
          <span>退出登录</span>
        </button>
      </div>
    </aside>

    <!-- 移动端侧边栏遮罩层 -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 内容区域（页面渲染目标） -->
    <main id="content-area" class="content-area"></main>

    <!-- 浮动入群按钮 -->
    <a href="#/qq-groups" id="floating-qq-btn" class="floating-qq-btn" title="加入QQ交流群（二群：957919628 / 一群已满员：1038910590）">💬</a>
  </div>

  <script type="module" src="/static/js/main.js?v=11.0"></script>
</body>
</html>
