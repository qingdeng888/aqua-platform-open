  // 更新用户信息
  function updateUserInfo() {
    const user = Auth.getUser();
    if (user) {
      document.getElementById('sidebar-username').textContent = user.display_name || user.username || '用户';
      document.getElementById('sidebar-useremail').textContent = user.email || '-';
      document.getElementById('sidebar-avatar').innerHTML = Icons.user(24);
    }
  }

  // 显示/隐藏侧边栏
  function setSidebarVisible(visible) {
    const sidebar = document.getElementById('app-sidebar');
    sidebar.style.display = visible ? 'flex' : 'none';
    const layout = document.getElementById('main-layout');
    layout.classList.toggle('with-sidebar', visible);
    // 移动端自动收起
    if (visible && window.innerWidth <= 768) {
      sidebar.classList.remove('mobile-open');
    }
  }

  // 移动端侧边栏切换
  function toggleMobileSidebar() {
    if (window.innerWidth > 768) return;
    const sidebar = document.getElementById('app-sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const isOpen = sidebar.classList.contains('mobile-open');
    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('active');
  }

  function closeMobileSidebar() {
    const sidebar = document.getElementById('app-sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('active');
  }

  // 高亮当前菜单
  function highlightNav(route) {
    document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
      const r = item.dataset.route;
      if (r === route) item.classList.add('active');
      else item.classList.remove('active');
    });
    document.querySelectorAll('.navbar-links a').forEach(item => {
      const r = item.dataset.route;
      if (r === route) item.classList.add('active');
      else item.classList.remove('active');
    });
  }

          </form>

            <span>·</span>
            <a href="#/register">没有账号？立即注册</a>
            <span>·</span>
            <a href="#/qq-groups" style="color:#12b7f5">💬 加入交流群</a>
          </div>
        </div>
      </div>
    `;
    // 绑定表单
    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type=submit]');
      const data = new FormData(form);
      const payload = { username: data.get('username'), password: data.get('password') };
      btn.disabled = true;
      btn.innerHTML = Icons.spinner(18) + ' 登录中...';
      try {
        await API.post('/api/auth/login', payload);
        Toast.success('登录成功');
        await Auth.fetchUser();
        // 检查免责协议确认状态
        if (!localStorage.getItem('disclaimer_ack_20260722')) {
          showDisclaimerNotice();

        Router.go('/console');
      } catch (err) {
        Toast.error(err.message);
        btn.disabled = false;
        btn.innerHTML = Icons.arrowRight(18) + ' 登录';
      }
    };
    bindPasswordToggle();
  }

  async function renderRegister() {
    setSidebarVisible(false);
    highlightNav('');
    const content = document.getElementById('content-area');
    content.innerHTML = `
      <div class="auth-page">
        <div class="auth-card">
          <div class="auth-header">

    // 发送验证码
    let countdown = 0;
    const sendBtn = document.getElementById('send-code-btn');
    sendBtn.onclick = async () => {
      const email = document.querySelector('input[name=email]').value.trim();
      if (!email) { Toast.warn('请先填写邮箱'); return; }
      if (countdown > 0) return;
      sendBtn.disabled = true;
      sendBtn.textContent = '发送中...';
      try {
        await API.post('/api/auth/send-code', { email, purpose: 'register' });
        Toast.success('验证码已发送至邮箱');
        countdown = 60;
        const timer = setInterval(() => {
          countdown--;
          sendBtn.textContent = countdown + 's';
          if (countdown <= 0) {
            clearInterval(timer);
            sendBtn.disabled = false;
            sendBtn.textContent = '发送验证码';
          }

        Toast.error(err.message);
        sendBtn.disabled = false;
        sendBtn.textContent = '发送验证码';

      const bd = { mouse_moves: 0, clicks: 0, scrolls: 0, keyboard_events: 0,

                   viewport_height: window.innerHeight, time_on_page_ms: 0 };
      const start = Date.now();
      let mmTimer;
      document.addEventListener('mousemove', () => { bd.mouse_moves++; }, { passive: true });
      document.addEventListener('click', () => { bd.clicks++; }, { passive: true });
      document.addEventListener('scroll', () => { bd.scrolls++; }, { passive: true });
      document.addEventListener('keydown', () => { bd.keyboard_events++; }, { passive: true });
      document.addEventListener('touchstart', () => { bd.touch_events++; }, { passive: true });
      document.addEventListener('visibilitychange', () => { bd.page_visibility++; });
      window._behaviorData = bd;
      // 在表单提交前填充停留时间
      const origSubmit = document.getElementById('register-form').onsubmit;
      document.getElementById('register-form').onsubmit = function(e) {
        bd.time_on_page_ms = Date.now() - start;
        return origSubmit.call(this, e);
      };
    })();

    document.getElementById('register-form').onsubmit = async (e) => {
      e.preventDefault();
      const agreeCheck = document.getElementById('agree-disclaimer');

        return;

      const form = e.target;
      const btn = form.querySelector('button[type=submit]');
      const data = new FormData(form);
      const payload = {
        username: data.get('username'),
        email: data.get('email'),
        code: data.get('code'),
        password: data.get('password'),
        behavior: window._behaviorData || {},
      };
      btn.disabled = true;
      btn.innerHTML = Icons.spinner(18) + ' 注册中...';
      try {
        await API.post('/api/auth/register', payload);
        Toast.success('注册成功，已自动登录');
        await Auth.fetchUser();
        Router.go('/console');
      } catch (err) {
        Toast.error(err.message);
        btn.disabled = false;
        btn.innerHTML = Icons.arrowRight(18) + ' 注册';
      }
    };
    bindPasswordToggle();
  }

  async function toggleKeyVisibility(keyId) {
    const vis = _keyVisibility[keyId] || { revealed: false, fullKey: '' };
    if (vis.revealed) {

      _keyVisibility[keyId] = vis;
      renderKeysList();
      return;
    }
    // 显示 - 需要从后端获取完整密钥
    if (vis.fullKey) {
      vis.revealed = true;
      _keyVisibility[keyId] = vis;
      renderKeysList();
      return;
    }
    // 首次显示，调用后端解密接口
    try {
      const result = await API.get('/api/user/keys/' + keyId + '/reveal');
      _keyVisibility[keyId] = { revealed: true, fullKey: result.key };

  async function copyFullKey(keyId) {
    const vis = _keyVisibility[keyId] || { revealed: false, fullKey: '' };
    let keyToCopy = vis.fullKey;
    if (!keyToCopy) {
      // 尚未获取过完整密钥，先调用接口获取
      try {
        const result = await API.get('/api/user/keys/' + keyId + '/reveal');
        keyToCopy = result.key;
        _keyVisibility[keyId] = { revealed: vis.revealed, fullKey: keyToCopy };
      } catch (err) {
        Toast.error('获取密钥失败：' + err.message);
        return;
      }
    }
    try {
      await navigator.clipboard.writeText(keyToCopy);
      Toast.success('密钥已复制到剪贴板');
    } catch (_) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = keyToCopy;
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      Toast.success('密钥已复制到剪贴板');
    }
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || chatState.streaming) return;
    input.value = '';
    input.style.height = 'auto';
    // 添加用户消息
    chatState.messages.push({ role: 'user', content: text });
    // 添加占位助手消息
    const placeholder = { role: 'assistant', content: '', reasoning: '', streaming: true };
    chatState.messages.push(placeholder);
    renderChatMessages();
    // 切换按钮
    document.getElementById('chat-send').style.display = 'none';
    document.getElementById('chat-stop').style.display = 'inline-flex';
    chatState.streaming = true;
    chatState.abortController = new AbortController();
    try {
      const payload = {
        model: chatState.model,
        messages: chatState.messages.filter(m => !m.streaming).map(m => ({ role: m.role, content: m.content })),
        stream: true,
      };
      if (chatState.webSearch) payload.web_search = true;
      const resp = await fetch('/api/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload),
        signal: chatState.abortController.signal,
      });
      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(errText || '请求失败');
      }
      // 流式读取
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const dataStr = line.slice(6).trim();
          if (dataStr === '[DONE]') continue;
          try {
            const chunk = JSON.parse(dataStr);
            // v10.0: 处理联网搜索结果
            if (chunk.search_results) {
              placeholder.search_results = chunk.search_results;
              renderChatMessages();
              continue;
            }
            const delta = chunk.choices?.[0]?.delta;
            if (delta) {
              if (delta.reasoning_content) placeholder.reasoning += delta.reasoning_content;
              if (delta.content) placeholder.content += delta.content;
              renderChatMessages();
            }
            if (chunk.usage) {
              placeholder.usage = chunk.usage;
            }
          } catch (_) {}
        }
      }
      placeholder.streaming = false;
      renderChatMessages();
      // 保存对话历史
      try {
        const title = text.slice(0, 30);
        const messagesToSave = chatState.messages.filter(m => !m.streaming).map(m => ({
          role: m.role,
          content: m.content,
          reasoning: m.reasoning || '',
        }));
        if (chatState.currentHistoryId) {
          await API.put('/api/chat/history/' + chatState.currentHistoryId, {
            title, model: chatState.model, messages: messagesToSave,
          });
        } else {
          const result = await API.post('/api/chat/history', {
            title, model: chatState.model, messages: messagesToSave,
          });
          chatState.currentHistoryId = result.id;
        }
        loadChatHistory();
      } catch (_) {}
    } catch (err) {
      placeholder.streaming = false;
      placeholder.content = '\n\n[请求失败：' + err.message + ']';
      renderChatMessages();
    } finally {
      chatState.streaming = false;
      chatState.abortController = null;
      document.getElementById('chat-send').style.display = 'inline-flex';
      document.getElementById('chat-stop').style.display = 'none';
    }
  }

      'minimaxai': 'MiniMax', 'stepfun-ai': '阶跃星辰', 'openai': 'OpenAI', 'meta': 'Meta',
      'mistralai': 'Mistral AI', 'nvidia': 'NVIDIA', 'google': 'Google', 'microsoft': 'Microsoft',
      'ibm': 'IBM', 'bytedance': '字节跳动', 'baai': 'BAAI', 'nv-mistralai': 'NVIDIA-Mistral',
      '01-ai': '零一万物', 'abacusai': 'Abacus.AI', 'writer': 'Writer', 'databricks': 'Databricks',
      'bigcode': 'BigCode', 'ai21labs': 'AI21 Labs', 'aisingapore': 'AI Singapore',
      'adept': 'Adept', 'poolside': 'Poolside', 'sarvamai': 'Sarvam AI',
      'snowflake': 'Snowflake', 'thinkingmachines': 'Thinking Machines',
      'upstage': 'Upstage', 'zyphra': 'Zyphra',
    };

    // 国产模型排前面
    const domesticPublishers = ['deepseek-ai', 'z-ai', 'qwen', 'moonshotai', 'minimaxai', 'stepfun-ai', 'bytedance', '01-ai'];

    // 按厂商分组
    const groups = {};
    models.forEach(m => {
      const owner = m.owned_by || (m.id.includes('/') ? m.id.split('/')[0] : '其他');
      if (!groups[owner]) groups[owner] = [];
      groups[owner].push(m);
    });

    // 排序：国产模型优先
    const sortedOwners = Object.keys(groups).sort((a, b) => {
      const aDom = domesticPublishers.includes(a) ? 0 : 1;
      const bDom = domesticPublishers.includes(b) ? 0 : 1;
      if (aDom !== bDom) return aDom - bDom;
      return groups[b].length - groups[a].length;
    });

    let html = `<div style="margin-bottom:12px;font-size:13px;color:var(--text-muted);">共 ${models.length} 个模型，${Object.keys(groups).length} 个厂商</div>`;
    for (const owner of sortedOwners) {
      const list = groups[owner];
      const displayName = publisherNames[owner] || owner;
      html += `
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">${escapeHtml(displayName)}</h3>
            <span class="muted">${list.length} 个模型</span>
          </div>
          <div class="grid grid-3">
            ${list.map(m => {
              const caps = m.capabilities || [];
              const isDeprecated = caps.includes('已弃用');
              const capTags = caps.filter(c => c !== '已弃用');
              const ctxLen = m.context_length;
              const ctxStr = ctxLen ? (ctxLen >= 1000000 ? (ctxLen/1000000)+'M' : (ctxLen >= 1000 ? (ctxLen/1000)+'K' : ctxLen)) : '';
              return `
              <div class="model-card" ${isDeprecated ? 'style="opacity:0.6"' : ''}>
                <div class="model-card-header">
                  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
                    <span style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${escapeHtml(m.display_name || m.id)}">${escapeHtml(m.display_name || m.id.split('/').pop())}</span>
                    <span style="font-size:10px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(m.id)}</span>
                  </div>
                  <button class="btn xs" onclick="copyToClipboard('${escapeAttr(m.id)}');Toast.success('模型ID已复制')" title="复制模型ID">${Icons.copy(12)}</button>
                  ${isDeprecated ? '<span class="tag cooling">已弃用</span>' : ''}
                </div>
                <div class="model-caps">
                  ${capTags.map(c => {
                    let cls = 'info';
                    if (c === '视觉') cls = 'warning';
                    else if (c === '嵌入') cls = 'success';
                    else if (c === '工具调用') cls = 'accent';
                    else if (c === '1M上下文') cls = 'info';
                    else if (c === '安全') cls = 'danger';
                    else if (c === '代码') cls = 'success';
                    else if (c === '推理') cls = 'accent';
                    return `<span class="tag ${cls}">${escapeHtml(c)}</span>`;
                  }).join('')}
                  ${ctxStr ? `<span class="tag info">↑${ctxStr}</span>` : ''}
                </div>
              </div>
            `}).join('')}
          </div>
        </div>
      `;
    }
    container.innerHTML = html;
  }

          </div>
          <div id="stats-leaderboard"></div>
        </div>
      </div>
    `;
    Loader.show('#stats-overview', '加载统计中');
    Loader.show('#stats-trend', '加载趋势中');
    Loader.show('#stats-models', '加载分布中');
    Loader.show('#stats-model-table', '加载表格中');
    Loader.show('#stats-leaderboard', '加载排行榜中');
    try {
      const [stats, ccs] = await Promise.all([
        API.get('/api/user/stats'),
        API.get('/api/user/concurrency-stats').catch(() => null),
      ]);
      const o = stats.overview || {};
      const hasData = (o.total_requests || 0) > 0 || (stats.trend_7d || []).length > 0;
      const elOverview = document.getElementById('stats-overview');
      if (elOverview) elOverview.innerHTML = `
        <div class="stat-card accent">
          <div class="stat-label">今日请求</div>
          <div class="stat-value">${Fmt.full(o.total_requests || 0)}</div>
        </div>
        <div class="stat-card success">
          <div class="stat-label">今日Token</div>
          <div class="stat-value" title="${Fmt.full(o.total_tokens || 0)}">${Fmt.number(o.total_tokens || 0)}</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-label">输入Token</div>
          <div class="stat-value">${Fmt.number(o.prompt_tokens || 0)}</div>
        </div>
        <div class="stat-card info">
          <div class="stat-label">输出Token</div>
          <div class="stat-value">${Fmt.number(o.completion_tokens || 0)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">并发状态</div>
          <div class="stat-value" style="font-size:18px">${ccs ? ccs.current+'/'+(ccs.limit_label||ccs.limit) : '...'}</div>
          <div class="stat-trend flat">${ccs && ccs.tag ? ccs.tag : ccs ? '峰值 '+(ccs.peak||0) : ''}</div>
        </div>
      `;
      renderTrendChart('stats-trend', stats.trend_7d || []);
      renderModelDistribution('stats-models', stats.model_distribution || []);
      renderModelTable('stats-model-table', stats.model_distribution || []);
      // 无数据时显示友好提示
      if (!hasData) {
        const hint = document.createElement('div');
        hint.className = 'card';
        hint.style.cssText = 'margin-top:16px;border-left:3px solid var(--accent-info)';
        hint.innerHTML = `<div style="padding:16px;display:flex;align-items:center;gap:12px">
          ${Icons.info(20)}
          <div>
            <div style="font-weight:600;margin-bottom:4px">暂无统计数据</div>
            <div class="muted">前往 <a href="#/console/chat" style="color:var(--accent-primary)">AI对话</a> 发起一次对话，统计数据将在请求后自动生成。</div>
          </div>
        </div>`;
        const _mtEl = document.getElementById('stats-model-table');
        if (_mtEl && _mtEl.parentElement) _mtEl.parentElement.appendChild(hint);
      }
      // 排行榜
      try {
        const lb = await API.get('/api/user/leaderboard?limit=20');
        if (lb && lb.leaderboard && lb.leaderboard.length > 0) {
          renderLeaderboard('stats-leaderboard', lb.leaderboard);
          const summary = document.getElementById('stats-leaderboard-summary');
          if (summary) summary.textContent = `今日活跃 ${lb.total?.active_users || 0} 人 · 总计 ${Fmt.number(lb.total?.total_requests || 0)} 请求 · ${Fmt.full(lb.total?.total_tokens || 0)} Tokens`;
        } else {
          const _lbEl = document.getElementById('stats-leaderboard');
          if (_lbEl) _lbEl.innerHTML = '<div class="empty-state" style="padding:24px"><div class="muted">暂无排行数据</div></div>';
        }
      } catch (e) {
        const _lbErrEl = document.getElementById('stats-leaderboard');
        if (_lbErrEl) _lbErrEl.innerHTML = '<div class="empty-state" style="padding:24px"><div class="muted">排行榜加载失败</div></div>';
      }
    } catch (err) {
      Toast.error('加载统计失败：' + err.message);
      const _errEl = document.getElementById('stats-overview');
      if (_errEl) _errEl.innerHTML = emptyState('加载失败，请刷新重试', 'error');
    }
  }

  function renderModelTable(containerId, data) {
    const container = document.getElementById(containerId);
    if (!container) return;
    if (!data.length) {
      container.innerHTML = emptyState('暂无模型使用记录');
      return;
    }
    // v10.0: 模型友好名称映射
    const modelDisplayNames = {};
    try { window._modelNames && window._modelNames.forEach(m => { modelDisplayNames[m.id] = m.display_name || m.id; }); } catch(e) {}
    container.innerHTML = `
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>模型</th>
              <th class="numeric">请求数</th>
              <th class="numeric">Token消耗</th>
              <th>占比</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(m => {
              const total = data.reduce((s, d) => s + (d.request_count || 0), 0);
              const dname = m.display_name || modelDisplayNames[m.model] || m.model;
              return `<tr>
                <td><span title="${escapeHtml(m.model)}">${escapeHtml(dname)}</span><br><span class="text-xs text-muted">${escapeHtml(m.model)}</span></td>
                <td class="numeric">${Fmt.full(m.request_count || 0)}</td>
                <td class="numeric">${Fmt.full(m.token_count || 0)}</td>
                <td>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width:${Fmt.percent(m.request_count, total).replace('%','')}%"></div>
                    <span>${Fmt.percent(m.request_count, total)}</span>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function loadFeedbackList() {
    try {
      const data = await API.get('/api/user/feedback?page=1&page_size=20');
      const el = document.getElementById('feedback-list');
      const countEl = document.getElementById('feedback-count');
      if (!el) return;
      if (countEl) countEl.textContent = '共 ' + (data.total || 0) + ' 条';
      if (!data.data || data.data.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + Icons.alert(32) + '</div><div>暂无反馈记录</div></div>';
        return;
      }
      const statusLabels = { pending: '待处理', processing: '处理中', resolved: '已解决', closed: '已关闭' };
      const statusColors = { pending: 'var(--accent-warning)', processing: 'var(--accent-info)', resolved: 'var(--accent-success)', closed: 'var(--text-muted)' };
      el.innerHTML = data.data.map(f => {
        const st = statusLabels[f.status] || f.status;
        const sc = statusColors[f.status] || 'var(--text-muted)';
        return '<div class="feedback-item" style="padding:12px 0;border-bottom:1px solid var(--border-light)">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
            '<strong style="font-size:13px">' + escapeHtml(f.title) + '</strong>' +
            '<span class="tag" style="background:rgba(0,0,0,0.1);color:' + sc + ';font-size:10px">' + st + '</span>' +
          '</div>' +
          '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">' + escapeHtml(f.content || '').slice(0, 200) + (f.content && f.content.length > 200 ? '...' : '') + '</div>' +
          (f.reply ? '<div style="font-size:12px;color:var(--accent-primary);padding:6px 10px;background:rgba(0,212,255,0.06);border-radius:6px;margin-bottom:4px"><strong>回复：</strong>' + escapeHtml(f.reply) + '</div>' : '') +
          '<div style="font-size:11px;color:var(--text-muted)">' + f.created_at.slice(0, 19).replace('T', ' ') + '</div>' +
        '</div>';
      }).join('');
    } catch (err) {
      const el = document.getElementById('feedback-list');
      if (el) el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + Icons.alert(36) + '</div><div>加载失败: ' + escapeHtml(err.message) + '</div></div>';
    }
  }

  function bindPasswordToggle() {
    document.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.toggle;
        const input = document.getElementById(id);
        if (input.type === 'password') {
          input.type = 'text';
          btn.innerHTML = Icons.eyeOff(16);
        } else {
          input.type = 'password';
          btn.innerHTML = Icons.eye(16);
        }
      };
    });
  }

  function renderTrendChart(containerId, data) {
    const container = document.getElementById(containerId);
    if (!data || !data.length) {
      container.innerHTML = emptyState('暂无趋势数据');
      return;
    }
    const max = Math.max(...data.map(d => d.request_count || 0), 1);
    container.innerHTML = `
      <div class="chart-bars">
        ${data.map(d => {
          const h = Math.max(4, (d.request_count / max) * 200);
          return `
            <div class="chart-bar-item" title="${escapeHtml(d.date)}: ${d.request_count}次 / ${Fmt.full(d.token_count||0)} tokens">
              <div class="chart-bar-value">${d.request_count}</div>
              <div class="chart-bar" style="height:${h}px"></div>
              <div class="chart-bar-label">${escapeHtml((d.date || '').slice(5))}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderStatusDistribution(containerId, logs) {
    const container = document.getElementById(containerId);
    if (!logs.length) {
      container.innerHTML = emptyState('暂无请求数据');
      return;
    }
    const groups = {};
    logs.forEach(l => {
      const s = l.status || 'unknown';
      groups[s] = (groups[s] || 0) + 1;
    });
    const total = logs.length;
    container.innerHTML = `
      <div class="status-dist">
        ${Object.entries(groups).map(([s, n]) => {
          const pct = (n / total * 100).toFixed(1);
          const stInfo = Fmt.status(s);
          return `
            <div class="status-dist-item">
              <div class="status-dist-label">
                <span class="status-dot ${stInfo.cls}"></span>
                <span>${stInfo.text}</span>
                <span class="muted">${n}次 (${pct}%)</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill ${stInfo.cls}" style="width:${pct}%"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderModelDistribution(containerId, data) {
    const container = document.getElementById(containerId);
    if (!container) return;
    if (!data.length) {
      container.innerHTML = emptyState('暂无模型使用数据');
      return;
    }
    const total = data.reduce((s, d) => s + (d.request_count || 0), 0) || 1;
    const colors = ['#00d4ff', '#448aff', '#00e676', '#ffab00', '#ff5252', '#ff4081', '#9c27b0', '#3f51b5'];
    // v10.0: 显示友好名称
    const modelDisplayNames = {};
    try { window._modelNames && window._modelNames.forEach(m => { modelDisplayNames[m.id] = m.display_name || m.id; }); } catch(e) {}
    container.innerHTML = `
      <div class="model-dist">
        ${data.slice(0, 8).map((d, i) => {
          const pct = ((d.request_count || 0) / total * 100).toFixed(1);
          const display = d.display_name || modelDisplayNames[d.model] || d.model;
          return `
            <div class="model-dist-item">
              <div class="model-dist-label">
                <span class="legend-dot" style="background:${colors[i % colors.length]}"></span>
                <span style="font-size:11px">${escapeHtml(display)}</span>
                <span class="muted">${pct}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${pct}%;background:${colors[i % colors.length]}"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  async function loadLogs() {
    const container = document.getElementById('logs-table');
    Loader.show(container, '加载日志中');
    try {
      const result = await API.get(`/api/user/request-logs?page=${logsState.page}&page_size=${logsState.pageSize}`);
      logsState.data = result.data || [];
      logsState.total = result.total || 0;
      document.getElementById('logs-total').textContent = `共 ${Fmt.full(logsState.total)} 条`;
      renderLogsTable();
      renderPagination(document.getElementById('logs-pagination'), logsState.total, logsState.page, logsState.pageSize, (p) => {
        logsState.page = p;
        loadLogs();
      });
    } catch (err) {
      container.innerHTML = emptyState('加载失败：' + err.message, 'error');
    }
  }

  function renderLogsTable() {
    const container = document.getElementById('logs-table');
    const data = applySort(logsState.data, logsState.sort.field, logsState.sort.order);
    if (!data.length) {
      container.innerHTML = emptyState('暂无请求日志');
      return;
    }
    container.innerHTML = `
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th data-sort="model">模型</th>
              <th data-sort="is_stream">类型</th>
              <th data-sort="status">状态</th>
              <th data-sort="prompt_tokens" class="numeric">输入Token</th>
              <th data-sort="completion_tokens" class="numeric">输出Token</th>
              <th data-sort="total_tokens" class="numeric">总计Token</th>
              <th data-sort="latency_ms" class="numeric">延迟</th>
              <th data-sort="created_at">时间</th>
              <th>详情</th>
            </tr>
          </thead>
          <tbody>
            ${data.map((l, i) => {
              const st = Fmt.status(l.status);
              const lat = Fmt.latency(l.latency_ms);
              const latColor = Fmt.latencyColor(l.latency_ms);
              return `<tr>
                <td><code>${escapeHtml(l.model || '-')}</code></td>
                <td>${l.is_stream ? '<span class="tag info">流式</span>' : '<span class="tag">非流式</span>'}</td>
                <td><span class="tag ${st.cls}"><span class="status-dot ${st.cls}"></span>${st.text}</span></td>
                <td class="numeric token-in">${Fmt.number(l.prompt_tokens || 0)}</td>
                <td class="numeric token-out">${Fmt.number(l.completion_tokens || 0)}</td>
                <td class="numeric token-total" title="${Fmt.full(l.total_tokens || 0)}">${Fmt.number(l.total_tokens || 0)}</td>
                <td class="numeric" style="color:${latColor}">${lat}</td>
                <td class="muted">${Fmt.time(l.created_at)}</td>
                <td><button class="btn xs" onclick="showLogDetail(${i})">${Icons.eye(12)}</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
    // 绑定排序
    container.querySelectorAll('th[data-sort]').forEach(th => {
      th.classList.toggle('sort-asc', logsState.sort.field === th.dataset.sort && logsState.sort.order === 'asc');
      th.classList.toggle('sort-desc', logsState.sort.field === th.dataset.sort && logsState.sort.order === 'desc');
      th.onclick = () => {
        const field = th.dataset.sort;
        if (logsState.sort.field === field) {
          logsState.sort.order = logsState.sort.order === 'asc' ? 'desc' : 'asc';
        } else {
          logsState.sort = { field, order: 'asc' };
        }
        renderLogsTable();
      };
    });
  }

  function showLogDetail(idx) {
    const l = logsState.data[idx];
    if (!l) return;
    Modal.show({
      title: '请求详情',
      body: `
        <div class="log-detail">

  /* ========== 模型状态页面 ========== */
  /* ========== 模型状态页面（优化排版） ========== */
  function _sortModels(models) {
    // 排序规则：
    // 1. 按状态分组：正常 > 警告 > 异常
    // 2. 同组内：健康分高优先，延迟低优先，成功率高优先
    const rank = { normal: 0, warning: 1, abnormal: 2 };
    return [...models].sort((a, b) => {
      const ra = rank[a.status] ?? 9, rb = rank[b.status] ?? 9;
      if (ra !== rb) return ra - rb;
      // 健康分降序
      if ((b.health_score || 0) !== (a.health_score || 0))
        return (b.health_score || 0) - (a.health_score || 0);
      // 延迟升序
      if ((a.avg_latency_ms || 0) !== (b.avg_latency_ms || 0))
        return (a.avg_latency_ms || 0) - (b.avg_latency_ms || 0);
      // 成功率降序
      return (b.success_rate || 0) - (a.success_rate || 0);
    });
  }

  function _renderModelCard(m) {
    const statusCls = m.status === 'normal' ? 'active' : (m.status === 'warning' ? 'warning' : 'cooling');
    const sr = m.success_rate || 0;
    const latency = m.avg_latency_ms || 0;
    const tb = m.total_buckets || 0;
    const hasBuckets = tb > 0;
    const c5xx = m.count_5xx_1h || 0;
    const c429 = m.count_429_1h || 0;

    // 推荐标记：正常 + 健康分>=90 + 延迟<2s + 成功率>=95%
    const isRecommended = m.status === 'normal' && (m.health_score || 0) >= 90 && latency < 2000 && sr >= 95;

    const borderColor = m.status === 'normal' ? 'var(--accent-success)' : m.status === 'warning' ? 'var(--accent-warning)' : 'var(--accent-danger)';

    return '<div class="ms-card" style="border-left:3px solid ' + borderColor + '">' +
      // 第一行：模型名（友好名称） + 状态标签 + 推荐 + 健康分
      '<div class="ms-card-header">' +
        '<div class="ms-card-title-group">' +
          '<div style="display:flex;flex-direction:column">' +
            '<span class="ms-model-name" title="' + escapeHtml(m.model) + '">' + escapeHtml(m.display_name || m.model) + '</span>' +
            '<span class="text-xs text-muted" style="margin-top:1px">' + escapeHtml(m.model) + ' <button class="btn xs" onclick="event.stopPropagation();copyToClipboard(\'' + escapeAttr(m.model) + '\');Toast.success(\'模型ID已复制\')" title="复制模型ID">' + Icons.copy(10) + '</button></span>' +
          '</div>' +
          (isRecommended ? '<span class="ms-badge ms-badge-rec">推荐</span>' : '') +
          '<span class="tag ' + statusCls + '" style="font-size:9px;padding:1px 5px">' + m.status_label + '</span>' +
        '</div>' +
        '<div class="ms-health">' +
          '<div class="ms-health-bar"><div class="ms-health-fill ' + (m.health_score >= 80 ? 's' : m.health_score >= 50 ? 'w' : 'd') + '" style="width:' + (m.health_score || 0) + '%"></div></div>' +
          '<span class="ms-health-score">' + (m.health_score || 0) + '</span>' +
        '</div>' +
      '</div>' +
      // 第二行：桶信息（如有） + 关键指标
      '<div class="ms-bucket-row">' +
        (hasBuckets ? '<span>密钥 ' + (m.healthy_buckets || 0) + '/' + tb + ' 健康</span><span class="sep">|</span>' : '') +
        '<span>成功率 ' + '<strong style="color:' + (sr >= 95 ? 'var(--accent-success)' : sr >= 80 ? 'var(--accent-warning)' : 'var(--accent-danger)') + '">' + sr + '%</strong></span>' +
        '<span class="sep">|</span>' +
        '<span>延迟 ' + '<strong style="color:' + (latency < 3000 ? 'var(--accent-success)' : latency < 10000 ? 'var(--accent-warning)' : 'var(--accent-danger)') + '">' + (latency >= 1000 ? (latency/1000).toFixed(1)+'s' : Math.round(latency)+'ms') + '</strong></span>' +
        '<span class="sep">|</span>' +
        '<span>1h ' + Fmt.number(m.total_requests_1h || 0) + '</span>' +
      '</div>' +
      // 第三行：辅助指标
      '<div class="ms-metrics">' +
        '<div class="ms-metric"><span class="ms-metric-label">429</span><span class="ms-metric-val" style="color:' + (c429 > 0 ? 'var(--accent-warning)' : 'var(--text-muted)') + '">' + Fmt.number(c429) + '</span></div>' +
        (c5xx > 0 ? '<div class="ms-metric"><span class="ms-metric-label">5xx</span><span class="ms-metric-val" style="color:var(--accent-danger)">' + Fmt.number(c5xx) + '</span></div>' : '') +
        '<div class="ms-metric"><span class="ms-metric-label">今日Token</span><span class="ms-metric-val" style="color:var(--accent-info)">' + Fmt.number(m.today_tokens || 0) + '</span></div>' +
        '<div class="ms-metric"><span class="ms-metric-label">活跃</span><span class="ms-metric-val">' + (m.active_users_1h || 0) + '</span></div>' +
      '</div>' +
    '</div>';
  }

  async function renderModelStatus() {
    if (!await ensureAuth()) return;
    setSidebarVisible(true);
    highlightNav('/console/model-status');
    const content = document.getElementById('content-area');
    content.innerHTML = '<div class="page"><div class="page-header"><h1 class="page-title">模型状态监控</h1><div id="ms-last-update" class="text-xs text-muted">加载中...</div></div><div id="ms-content"><div class="loader-wrap"><div class="loader-spinner">' + Icons.spinner(32) + '</div><div class="loader-text">加载模型状态数据...</div></div></div></div>';
    try {
      const data = await API.get('/api/user/models/status');
      const rawModels = data.models || [];
      const summary = data.summary || {};
      const lu = document.getElementById('ms-last-update');
      if (lu) lu.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');

      // 降级警告
      let degradedBanner = '';
      if (data.degraded) {
        degradedBanner = '<div class="ms-degraded"><span>' + Icons.alert(18) + '</span><span>数据源降级：' + escapeHtml(data.degraded) + '（无实时桶数据）</span></div>';
      }

      // 排序：正常优先，同组内健康分高+延迟低+成功率高优先
      const sorted = _sortModels(rawModels);

      // 统计摘要
      const hasBucketData = sorted.some(m => m.total_buckets > 0);
      const sc = [
        { label: '正常模型', value: summary.normal || 0, cls: 'success' },
        { label: '警告模型', value: summary.warning || 0, cls: 'warning' },
        { label: '异常模型', value: summary.abnormal || 0, cls: 'danger' },
        { label: '1h请求', value: Fmt.number(summary.total_requests_1h || 0), cls: 'accent' },
      ];
      if (hasBucketData) {
        sc.push({ label: '健康密钥', value: sorted.reduce((s, m) => s + (m.healthy_buckets || 0), 0), cls: 'success' });
        sc.push({ label: '冷却密钥', value: sorted.reduce((s, m) => s + (m.cooled_buckets || 0), 0), cls: 'warning' });
      }
      const summaryHtml = '<div class="ms-summary">' +
        sc.map(c => '<div class="stat-card ' + c.cls + '"><div class="stat-label">' + c.label + '</div><div class="stat-value">' + c.value + '</div></div>').join('') +
        '</div>';

      // 按状态分组
      const groups = { normal: [], warning: [], abnormal: [] };
      sorted.forEach(m => { if (groups[m.status]) groups[m.status].push(m); });

      const statusNames = { normal: '正常', warning: '警告', abnormal: '异常' };
      const groupParts = [];
      for (const st of ['normal', 'warning', 'abnormal']) {
        const list = groups[st];
        if (!list || list.length === 0) continue;
        groupParts.push(
          '<div class="ms-section">' +
            '<div class="ms-section-header">' +
              '<span class="ms-section-title"><span class="status-dot ' + st + '" style="vertical-align:middle;margin-right:6px"></span>' + statusNames[st] + '模型</span>' +
              '<span class="ms-section-count">' + list.length + ' 个</span>' +
            '</div>' +
            '<div class="ms-card-list">' +
              list.map(m => _renderModelCard(m)).join('') +
            '</div>' +
          '</div>'
        );
      }

      const mc = document.getElementById('ms-content');
      if (mc) mc.innerHTML = degradedBanner + summaryHtml + groupParts.join('');
    } catch (e) {
      const mc = document.getElementById('ms-content');
      if (mc) mc.innerHTML = '<div class="empty-state"><div class="empty-icon">' + Icons.alert(36) + '</div><div>加载失败: ' + escapeHtml(e.message) + '</div></div>';
    }
  }

    `;
    Loader.show('#models-list', '加载模型列表中');
    try {

      window._modelNames = models || [];
      renderModelsList(models || []);
      const searchInput = document.getElementById('model-search');
      const filterSelect = document.getElementById('model-filter');
      const applyFilters = () => {
        const keyword = searchInput.value.toLowerCase();
        const filter = filterSelect.value;
        const filtered = (models || []).filter(m => {
          const matchKeyword = !keyword || m.id.toLowerCase().includes(keyword) || (m.display_name || '').toLowerCase().includes(keyword);
          const caps = m.capabilities || [];
          let matchFilter = true;
          if (filter === 'chat') matchFilter = caps.includes('推理') && !caps.includes('嵌入') && !caps.includes('安全');
          else if (filter === 'vision') matchFilter = caps.includes('视觉');
          else if (filter === 'embed') matchFilter = caps.includes('嵌入');
          else if (filter === 'code') matchFilter = caps.includes('代码');
          else if (filter === 'safety') matchFilter = caps.includes('安全');
          return matchKeyword && matchFilter;
        });
        renderModelsList(filtered);
      };
      searchInput.addEventListener('input', debounce(applyFilters, 200));
      filterSelect.addEventListener('change', applyFilters);
    } catch (err) {
