<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AQUA 管理后台 v10.0</title>
<style>
/* ===== 设计令牌（与 gateway 控制台同代际的深色体系） ===== */
:root{
  --bg-0:#0e0f1c; --bg-1:#1a1a2e; --bg-2:#20203a; --bg-3:#262647;
  --border:#2e2e52; --border-2:#3d3d6e;
  --primary:#00d4ff; --primary-2:#448aff; --on-primary:#081020;
  --text:#e8eaf6; --text-2:#a0a4c8; --text-3:#6d7195;
  --success:#3ddc84; --warning:#ffb224; --danger:#ff5c5c; --danger-2:#c62828;
  --radius:12px; --radius-sm:8px;
  --grad:linear-gradient(135deg,#00d4ff,#448aff);
  --shadow:0 8px 32px rgba(0,0,0,.35);
  --mono:'SF Mono','Cascadia Code',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg-0);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-2);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--border-2);background:var(--bg-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-primary{background:var(--grad);border:none;color:var(--on-primary);font-weight:600}
.btn-primary:hover{filter:brightness(1.12)}
.btn-danger{background:var(--danger-2);border-color:var(--danger-2);color:#fff}
.btn-danger:hover{background:#a01f1f;border-color:#a01f1f}
.btn-warning{background:var(--warning);border-color:var(--warning);color:#241500}
.btn-success{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.5);color:var(--success)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-2)}
.btn-outline:hover{color:var(--text);border-color:var(--border-2)}

/* ===== 登录 ===== */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:radial-gradient(1200px 600px at 20% -10%,rgba(0,212,255,.08),transparent),radial-gradient(900px 500px at 110% 110%,rgba(68,138,255,.08),transparent)}
.login-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);padding:40px;width:100%;max-width:380px;text-align:center;box-shadow:var(--shadow)}
.login-card .logo{width:52px;height:52px;border-radius:14px;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--on-primary);font-size:24px;font-weight:800}
.login-card h1{font-size:20px;margin-bottom:4px;color:#fff}
.login-card .sub{font-size:13px;color:var(--text-3);margin-bottom:24px}
.form-group{margin-bottom:14px;text-align:left}
.form-group label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.form-group input{width:100%;padding:10px 12px;background:var(--bg-0);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:11px}
.login-error{font-size:12px;color:var(--danger);margin-top:10px;min-height:18px}

/* ===== 布局：侧栏 + 主区 ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;min-width:220px;background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 16px;border-bottom:1px solid var(--border)}
.brand-logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:var(--on-primary);font-weight:800;font-size:18px;flex:none}
.brand-name{font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.brand-name small{display:block;font-size:11px;font-weight:400;color:var(--text-3)}
.side-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-2);font-size:13px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--bg-2);color:var(--text)}
.nav-item.active{background:rgba(0,212,255,.1);color:var(--primary);border-color:rgba(0,212,255,.25)}
.nav-item .ico{width:18px;text-align:center;flex:none}
.side-foot{padding:12px;border-top:1px solid var(--border)}
.side-foot .btn{width:100%}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bg-1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.crumb{font-size:16px;font-weight:600;color:#fff}
.crumb .sep{color:var(--text-3);font-weight:400;margin:0 6px}
.crumb .cur{color:var(--primary)}
.content{flex:1;padding:20px 24px;max-width:1200px;width:100%;margin:0 auto}

/* ===== 统计 ===== */
.stats-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-box{flex:1;min-width:140px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
.stat-box .num{font-size:22px;font-weight:700;color:#fff}
.stat-box .lbl{font-size:11px;color:var(--text-3);margin-top:2px}

/* ===== 工具栏 ===== */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;padding:9px 12px;background:var(--bg-0);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--primary)}
.filter-select{padding:9px 12px;background:var(--bg-0);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none}
.filter-select:focus{border-color:var(--primary)}

/* ===== 表格 ===== */
.table-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 14px;font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;background:var(--bg-2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(46,46,82,.6)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.025)}
.mono{font-family:var(--mono);font-size:12px}
.text-muted{color:var(--text-3)}
.status-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:500}
.status-active{background:rgba(61,220,132,.12);color:var(--success)}
.status-banned{background:rgba(255,92,92,.12);color:var(--danger)}
.cell-actions{white-space:nowrap;display:flex;gap:6px}

/* ===== 分页 ===== */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-2);border-top:1px solid var(--border)}
.page-info{font-size:12px;color:var(--text-2)}
.page-btns{display:flex;gap:4px}
.page-btns .btn{min-width:64px}

/* ===== 状态块（加载/空/错误） ===== */
.state-block{text-align:center;padding:48px 20px}
.state-block .ico{font-size:26px;display:block;margin-bottom:8px;opacity:.7}
.state-block .msg{color:var(--text-3);font-size:13px;margin-bottom:12px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 确认弹窗（危险操作二次确认） ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,6,15,.65);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--radius);width:90%;max-width:420px;padding:24px;box-shadow:var(--shadow)}
.modal-box h3{font-size:16px;margin-bottom:8px;color:#fff}
.modal-box p{font-size:13px;color:var(--text-2);margin-bottom:18px;line-height:1.6}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

/* ===== Toast ===== */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;pointer-events:auto;animation:slideIn .2s ease;max-width:360px;box-shadow:var(--shadow)}
.toast.success{background:rgba(24,72,48,.95);color:#a7f3c9;border:1px solid rgba(61,220,132,.5)}
.toast.error{background:rgba(76,16,20,.95);color:#fda4a4;border:1px solid rgba(255,92,92,.5)}
.toast.info{background:rgba(18,42,72,.95);color:#9dd3ff;border:1px solid rgba(0,212,255,.4)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== 响应式 ===== */
@media (max-width:768px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;justify-content:space-between}
  .side-nav,.brand-name small{display:none}
  .brand{border-bottom:none;padding:12px 16px}
  .side-foot{border-top:none;padding:8px 12px}
  .content{padding:16px 12px}
  .topbar{padding:10px 12px}
}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo">A</div>
    <h1>AQUA 管理后台</h1>
    <p class="sub">请输入管理员密码</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="passwordInput">管理员密码</label>
        <input type="password" id="passwordInput" placeholder="输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">登录</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- 管理后台骨架：侧栏导航 + 顶栏 + 主内容 -->
<div id="adminShell" class="shell hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">A</div>
      <div class="brand-name">AQUA<small>平台管理后台</small></div>
    </div>
    <nav class="side-nav">
      <div class="nav-item active" id="navUsers"><span class="ico">&#128100;</span>用户管理</div>
    </nav>
    <div class="side-foot">
      <button class="btn btn-outline btn-sm" id="logoutBtn">退出登录</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb">管理后台<span class="sep">/</span><span class="cur">用户管理</span></div>
      <button class="btn btn-sm" id="refreshBtn">&#128260; 刷新</button>
    </header>
    <main class="content">
      <div class="stats-bar" id="statsBar"></div>
      <div class="toolbar">
        <input class="search-input" id="searchInput" placeholder="搜索用户名、邮箱、昵称...">
        <select class="filter-select" id="statusFilter">
          <option value="">全部状态</option>
          <option value="active">正常</option>
          <option value="banned">封禁</option>
        </select>
      </div>
      <div class="table-card" id="tableWrap"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<!-- 危险操作二次确认弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">确认操作</h3>
    <p id="modalBody">确定要执行此操作吗？</p>
    <div class="modal-actions">
      <button class="btn btn-sm btn-outline" id="modalCancel">取消</button>
      <button class="btn btn-sm btn-danger" id="modalConfirmBtn">确定</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/static/js/admin/admin.js"></script>
</body>
</html>
